services:
  - type: web
    name: zotrix-next
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: SETUP_KEY
        sync: false
      - key: NODE_ENV
        value: production
